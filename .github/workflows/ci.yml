---
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Perl ${{ matrix.perl }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        perl:
          - "5.38"
          - "5.36"
          - "5.34"
          - "5.32"
          - "5.30"
          - "5.28"
          - "5.26"
          - "5.24"
        include:
          # Test on macOS with the latest stable Perl
          - os: macos-latest
            perl: "5.38"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl version
        run: perl -V

      - name: Install cpanm
        run: cpanm --notest App::cpanminus

      - name: Install dependencies
        run: cpanm --notest --installdeps .

      - name: Run tests
        run: prove -lr t/
        env:
          AUTHOR_TESTING: 1
          RELEASE_TESTING: 1
