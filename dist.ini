name    = WWW-Spotify
author  = Aaron Johnson <aaronjjohnson@gmail.com>
license = Perl_5
copyright_holder = Aaron Johnson
copyright_year   = 2024

[@Author::OALDERS]
StaticInstall.mode = on
StaticInstall.dry_run = 0
-remove = CheckChangesHasContent
AutoPrereqs.skip = ^MockUA$
Test::Pod::Coverage::Configurable.trustme = WWW::Spotify => qr/(format_results|get_client_credentials|me|next_result_set|previous_result_set|query_full_url|send_get_request|send_post_request)/

[PruneFiles]
match = ^docs/

[Prereqs / RuntimeRequires]
LWP::Protocol::https = 6.10
perl = 5.024
